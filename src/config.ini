# ════════════════════════════════════════════════════════════════════════════
#                     SystemMonitor v2.0 - Конфигурация
# ════════════════════════════════════════════════════════════════════════════
#
# Этот файл позволяет настроить поведение системного монитора.
# Все параметры также могут быть переопределены через переменные окружения.
# Приоритет: Переменные окружения > Этот файл > Значения по умолчанию
#
# ════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────
# ОСНОВНЫЕ НАСТРОЙКИ
# ──────────────────────────────────────────────────────────────────────────

[general]
# Безопасный режим (отключает все внешние вызовы)
# 0 = выключен, 1 = включен
safe_mode=0

# Режим отладки (вывод подробной информации в stderr)
# 0 = выключен, 1 = включен
debug=0

# Интервал обновления в миллисекундах (по умолчанию 2000)
update_interval=2000

# Язык интерфейса (ru/en)
language=ru

# ──────────────────────────────────────────────────────────────────────────
# МОДУЛИ МОНИТОРИНГА
# ──────────────────────────────────────────────────────────────────────────

[modules]
# Мониторинг батареи (только для ноутбуков)
# 0 = отключен, 1 = включен
battery=1

# Мониторинг GPU (видеокарты)
# 0 = отключен, 1 = включен
gpu=1

# Мониторинг USB устройств
# 0 = отключен, 1 = включен
usb=1

# Показывать погоду (требуется интернет)
# 0 = отключена, 1 = включена
weather=1

# Показывать имя Wi-Fi сети
# 0 = отключено, 1 = включено
wifi=1

# SMART мониторинг дисков (требуется smartmontools)
# 0 = отключен, 1 = включен
smart=1

# Мониторинг температур через SMC
# 0 = отключен, 1 = включен
smc_temps=1

# Отображение диагностики при запуске
# 0 = отключено, 1 = включено
show_diagnostics=1

# ──────────────────────────────────────────────────────────────────────────
# ПОРОГОВЫЕ ЗНАЧЕНИЯ ДЛЯ ОПОВЕЩЕНИЙ
# ──────────────────────────────────────────────────────────────────────────

[thresholds]
# Порог загрузки CPU для предупреждения (в процентах)
cpu_warning=85.0
cpu_critical=95.0

# Порог использования памяти для предупреждения (в процентах)
memory_warning=90.0
memory_critical=95.0

# Порог температуры для предупреждения (в градусах Цельсия)
temperature_warning=75.0
temperature_critical=85.0

# Порог свободного места на диске для предупреждения (в процентах)
disk_free_warning=20.0
disk_free_critical=10.0

# Порог заряда батареи для предупреждения (в процентах)
battery_low=20.0
battery_critical=10.0

# ──────────────────────────────────────────────────────────────────────────
# ОБНАРУЖЕНИЕ АНОМАЛИЙ
# ──────────────────────────────────────────────────────────────────────────

[anomaly]
# Чувствительность обнаружения аномалий (стандартное отклонение)
# Меньшее значение = более чувствительное обнаружение
# Рекомендуемые значения: 1.5 (чувствительно), 2.0 (нормально), 3.0 (грубо)
sigma=2.0

# Размер окна для анализа аномалий (в замерах)
window_size=30

# Минимальное количество замеров перед началом детекции
min_samples=10

# ──────────────────────────────────────────────────────────────────────────
# ЛОГИРОВАНИЕ
# ──────────────────────────────────────────────────────────────────────────

[logging]
# Путь к CSV файлу для логирования метрик
# Оставьте пустым для отключения логирования
csv_file=

# Путь к файлу системного лога
# Оставьте пустым для отключения
system_log=/var/log/sysmon.log

# Уровень логирования (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_level=INFO

# Максимальный размер лог-файла в МБ (после достижения создается новый файл)
max_log_size=10

# Количество резервных копий лог-файлов
log_backups=3

# ──────────────────────────────────────────────────────────────────────────
# ИНТЕРФЕЙС
# ──────────────────────────────────────────────────────────────────────────

[interface]
# Использовать цвета в интерфейсе
# 0 = отключено, 1 = включено (автоопределение), 2 = принудительно
use_colors=1

# Использовать Unicode символы для рамок и графиков
# 0 = ASCII только, 1 = Unicode
use_unicode=1

# Показывать иконки emoji
# 0 = отключено, 1 = включено
show_icons=1

# Тема оформления (default, dark, light, matrix, cyberpunk)
theme=default

# Прозрачность фона (0-100, работает не во всех терминалах)
transparency=0

# ──────────────────────────────────────────────────────────────────────────
# ПРОЦЕССЫ
# ──────────────────────────────────────────────────────────────────────────

[processes]
# Количество процессов на странице
processes_per_page=15

# Сортировка по умолчанию (cpu, mem, pid, name)
default_sort=cpu

# Показывать системные процессы
show_system_processes=1

# Показывать процессы других пользователей
show_other_users=1

# Автообновление списка процессов (в секундах, 0 = отключено)
auto_refresh=2

# ──────────────────────────────────────────────────────────────────────────
# СЕТЬ
# ──────────────────────────────────────────────────────────────────────────

[network]
# Интерфейс для мониторинга (auto = автоопределение)
interface=auto

# Показывать IPv6 адреса
show_ipv6=0

# Единицы измерения скорости (bits, bytes)
speed_units=bytes

# ──────────────────────────────────────────────────────────────────────────
# ПОГОДА (требуется интернет)
# ──────────────────────────────────────────────────────────────────────────

[weather]
# API ключ для погодного сервиса (получите на openweathermap.org)
api_key=

# Город для отображения погоды (оставьте пустым для автоопределения)
city=

# Единицы измерения температуры (celsius, fahrenheit, kelvin)
units=celsius

# Интервал обновления погоды в минутах
update_interval=30

# ──────────────────────────────────────────────────────────────────────────
# ЭКСПОРТ ДАННЫХ
# ──────────────────────────────────────────────────────────────────────────

[export]
# Включить экспорт в Prometheus
prometheus_enabled=0
prometheus_port=9100

# Включить экспорт в Grafana
grafana_enabled=0
grafana_url=http://localhost:3000
grafana_api_key=

# Включить экспорт в InfluxDB
influxdb_enabled=0
influxdb_url=http://localhost:8086
influxdb_database=sysmon
influxdb_username=
influxdb_password=

# ──────────────────────────────────────────────────────────────────────────
# УВЕДОМЛЕНИЯ
# ──────────────────────────────────────────────────────────────────────────

[notifications]
# Включить звуковые уведомления
sound_enabled=0

# Включить системные уведомления (через osascript)
system_notifications=0

# Включить отправку email уведомлений
email_enabled=0
email_smtp_server=
email_smtp_port=587
email_from=
email_to=
email_password=

# Включить отправку в Telegram
telegram_enabled=0
telegram_bot_token=
telegram_chat_id=

# ──────────────────────────────────────────────────────────────────────────
# РАСШИРЕННЫЕ НАСТРОЙКИ
# ──────────────────────────────────────────────────────────────────────────

[advanced]
# Количество ядер CPU для мониторинга (0 = все)
cpu_cores_limit=0

# Размер буфера истории для графиков (в замерах)
history_buffer_size=60

# Таймаут для внешних команд в секундах
command_timeout=5

# Кэширование данных в секундах
cache_ttl=5

# Приоритет процесса (-20 до 19, меньше = выше приоритет)
process_priority=0

# Использовать аппаратное ускорение для отрисовки (экспериментально)
hardware_acceleration=0

# ════════════════════════════════════════════════════════════════════════════
# Конец конфигурационного файла
# При изменении параметров перезапустите программу или нажмите 'R' в интерфейсе
# ════════════════════════════════════════════════════════════════════════════
