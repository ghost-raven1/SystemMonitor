# Конфигурационный файл для Системного монитора (SysMon)
# Формат: КЛЮЧ=ЗНАЧЕНИЕ
# Пустые строки и строки начинающиеся с # игнорируются

# === ОСНОВНЫЕ НАСТРОЙКИ ===

# Безопасный режим (1 = включен, 0 = отключен)
# В безопасном режиме отключаются потенциально опасные операции
SYSMON_SAFE=0

# === ОТКЛЮЧЕНИЕ МОДУЛЕЙ ===

# Отключить мониторинг батареи (1 = отключен)
SYSMON_NO_BAT=0

# Отключить мониторинг GPU (1 = отключен)
SYSMON_NO_GPU=0

# Отключить мониторинг USB устройств (1 = отключен)
SYSMON_NO_USB=0

# Отключить диагностику при запуске (1 = отключен)
SYSMON_NO_DIAG=0

# Отключить погоду (1 = отключен)
SYSMON_NO_WEATHER=0

# Отключить мониторинг WiFi (1 = отключен)
SYSMON_NO_WIFI=0

# === ПОРОГИ АНОМАЛИЙ ===

# Порог CPU для предупреждений (%)
SYSMON_THR_CPU=85

# Порог памяти для предупреждений (%)
SYSMON_THR_MEM=90

# Порог температуры для предупреждений (°C)
SYSMON_THR_TEMP=80

# Чувствительность обнаружения аномалий (сигма)
SYSMON_ANOMALY_SIGMA=2.0

# === ЭКСПОРТ ДАННЫХ ===

# Путь для CSV экспорта метрик (оставьте пустым для отключения)
# SYSMON_CSV=/var/log/sysmon_metrics.csv

# Путь для пользовательского конфига (альтернатива переменной окружения)
# SYSMON_CONFIG=/etc/sysmon/config.ini

# === ПОГОДА ===

# Город для отображения погоды (по умолчанию определяется автоматически)
SYSMON_WEATHER_CITY=Москва

# === ПРОИЗВОДИТЕЛЬНОСТЬ ===

# Интервал обновления UI (миллисекунды)
# SYSMON_UPDATE_INTERVAL=2000

# === ЛОГИРОВАНИЕ ===

# Уровень логирования (0=отключено, 1=ошибки, 2=предупреждения, 3=инфо)
# SYSMON_LOG_LEVEL=2

# Путь для файла логов (оставьте пустым для вывода в stderr)
# SYSMON_LOG_FILE=/var/log/sysmon.log

# === РАЗРАБОТКА ===

# Включить отладочный режим (1 = включен)
SYSMON_DEBUG=0

# === ПРИМЕРЫ КОНФИГУРАЦИИ ===

# Минималистичный режим (только базовые метрики)
# SYSMON_SAFE=1
# SYSMON_NO_BAT=1
# SYSMON_NO_GPU=1
# SYSMON_NO_USB=1
# SYSMON_NO_WEATHER=1

# Режим для сервера (максимальная производительность)
# SYSMON_THR_CPU=95
# SYSMON_THR_MEM=95
# SYSMON_THR_TEMP=90
# SYSMON_CSV=/var/log/sysmon_server.csv

# Режим для ноутбука (фокус на мобильные метрики)
# SYSMON_WEATHER_CITY=Автоматически
# SYSMON_NO_DIAG=0

# Режим для разработки (максимум отладочной информации)
# SYSMON_DEBUG=1
# SYSMON_LOG_LEVEL=3
# SYSMON_UPDATE_INTERVAL=1000